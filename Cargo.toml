[package]
name = "aegis_core"
version = "5.0.0"
edition = "2021"
authors = ["Aegis Recovery Team"]
description = "High-performance Rust carving engine for Aegis Data Recovery"

[lib]
name = "aegis_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"
memchr = "2.7"
crc32fast = "1.4"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_UI_Shell",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true